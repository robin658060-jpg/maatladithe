
name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir proj
          unzip -q ./*.zip -d proj
          d=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "PROJ=$d" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: MaatladitheContact-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
